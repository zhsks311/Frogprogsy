name: Cross-platform CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "gui/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "bunfig.toml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/package-lifecycle.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/prepare-release.yml"
      - ".github/workflows/publish-prepared-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  promotion-guard:
    name: Develop promotion guard
    runs-on: namespace-profile-linux-x86-4-8
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require develop head for main pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$REPOSITORY" ]; then
              echo "::error::Pull requests to main must come from this repository's develop branch; got ${HEAD_REPO}:${HEAD_REF}"
              exit 1
            fi
          fi

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: namespace-profile-linux-x86-4-8
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: namespace-profile-macos
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install GUI dependencies
        working-directory: gui
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Test
        run: bun test --isolate ./tests

      - name: Check release helper syntax
        run: bun build scripts/release.ts --target=bun --outdir=.tmp/ci-release-script-check

      - name: GUI build
        run: bun run build:gui

      - name: CLI help smoke
        run: bun run src/cli.ts help

      - name: macOS Keychain lifecycle smoke
        if: runner.os == 'macOS'
        timeout-minutes: 3
        env:
          FROGP_KEYCHAIN_SMOKE: "1"
        run: bun scripts/macos-keychain-lifecycle-smoke.ts

      - name: macOS Keychain smoke cleanup
        if: always() && runner.os == 'macOS'
        timeout-minutes: 2
        env:
          FROGP_KEYCHAIN_SMOKE: "1"
        run: bun scripts/macos-keychain-lifecycle-smoke.ts --cleanup
