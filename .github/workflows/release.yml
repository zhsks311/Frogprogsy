            throw new Error("existing npm version failed exact digest or channel validation");
          }
          const verified = await Bun.file(process.env.VERIFICATION_FILE!).json();
          const expectedDigest = process.env.EXPECTED_SHA512_HEX!;
          const expectedRepository = "zhsks311/Frogprogsy";
          const expectedRef = "refs/heads/main";
          const expectedSignerUri =
            "https://github.com/zhsks311/Frogprogsy/.github/workflows/release.yml@refs/heads/main";
          const workflowCommits: string[] = [];
          for (const row of Array.isArray(verified) ? verified : []) {
            const verificationResult = row?.verificationResult;
            const statement = verificationResult?.statement;
            if (
              statement?.predicateType !== "https://slsa.dev/provenance/v1"
              || statement.subject?.some((subject: { digest?: { sha512?: string } }) =>
                subject.digest?.sha512 === expectedDigest
              ) !== true
            ) continue;
            const certificate = verificationResult?.signature?.certificate;
            const workflowSha = certificate?.githubWorkflowSHA;
            if (
              certificate?.githubWorkflowRepository !== expectedRepository
              || certificate.githubWorkflowRef !== expectedRef
              || certificate.buildSignerURI !== expectedSignerUri
              || typeof workflowSha !== "string"
              || !/^[0-9a-f]{40}$/.test(workflowSha)
              || certificate.buildSignerDigest !== workflowSha
              || certificate.buildConfigDigest !== workflowSha
            ) continue;
            workflowCommits.push(workflowSha);
          }
          const uniqueWorkflowCommits = [...new Set(workflowCommits)].sort();
          if (uniqueWorkflowCommits.length === 0) {
            throw new Error("verified certificate lacks the trusted release workflow identity");
          }
          await Bun.write(process.env.WORKFLOW_COMMITS_FILE!, `${uniqueWorkflowCommits.join("\n")}\n`);
          BUN

            local provenance_on_main=false workflow_commit comparison
            while IFS= read -r workflow_commit; do
              [[ "$workflow_commit" =~ ^[0-9a-f]{40}$ ]] || return 1
              comparison="$(gh api "repos/${REPOSITORY}/compare/${workflow_commit}...main" --jq '.status')" || return 1
              case "$comparison" in
                ahead|identical) provenance_on_main=true ;;
              esac
            done < "$workflow_commits_file"
            test "$provenance_on_main" = "true" || {
              echo "::error::verified release workflow commit is not in current main history"
              return 1
            }
            rm -rf "$proof_dir"
          }

          if [ "$RECOVERY" != "true" ]; then
            if [ "$version_exists" = "true" ] || [ "$tag_exists" = "true" ] || [ "$release_exists" = "true" ]; then
              echo "::error::normal release requires npm version, Git tag, and GitHub Release all absent"
              exit 1
            fi
            echo "publish_required=true" >> "$GITHUB_OUTPUT"
            echo "tag_required=true" >> "$GITHUB_OUTPUT"
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$version_exists" != "true" ]; then
            if [ "$tag_exists" = "true" ] || [ "$release_exists" = "true" ]; then
              echo "::error::npm is absent while immutable Git or GitHub metadata already exists"
              exit 1
            fi
            echo "publish_required=true" >> "$GITHUB_OUTPUT"
            echo "tag_required=true" >> "$GITHUB_OUTPUT"
            echo "release_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never republish an existing npm version. Recovery first proves that
          # provenance, tarball bytes, source SHA, and channel are identical.
          validate_existing_npm
          echo "publish_required=false" >> "$GITHUB_OUTPUT"
          if [ "$tag_exists" = "true" ]; then
            echo "tag_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_required=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$release_exists" = "true" ]; then
            echo "release_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require unchanged inspected external state
        env:
          ACTUAL_PUBLISH_REQUIRED: ${{ steps.current_state.outputs.publish_required }}
          ACTUAL_RELEASE_REQUIRED: ${{ steps.current_state.outputs.release_required }}
          ACTUAL_TAG_REQUIRED: ${{ steps.current_state.outputs.tag_required }}
          EXPECTED_PUBLISH_REQUIRED: ${{ needs.inspect.outputs.publish_required }}
          EXPECTED_RELEASE_REQUIRED: ${{ needs.inspect.outputs.release_required }}
          EXPECTED_TAG_REQUIRED: ${{ needs.inspect.outputs.tag_required }}
        run: |
          set -euo pipefail
          test "$ACTUAL_PUBLISH_REQUIRED" = "$EXPECTED_PUBLISH_REQUIRED" \
            && test "$ACTUAL_TAG_REQUIRED" = "$EXPECTED_TAG_REQUIRED" \
            && test "$ACTUAL_RELEASE_REQUIRED" = "$EXPECTED_RELEASE_REQUIRED" || {
              echo "::error::Registry, Git tag, or GitHub Release state changed after inspection"
              exit 1
            }

      - name: Recheck gates immediately before release mutation
        env:
          CI_RUN: ${{ needs.preflight.outputs.ci_run }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ needs.preflight.outputs.package_run }}
          PAGES_RUN: ${{ needs.preflight.outputs.pages_run }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
        run: |
          set -euo pipefail

          latest_run() {
            local workflow="$1"
            local branch="$2"
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${EXPECTED_SHA}&event=push&branch=${branch}&per_page=100" |
              jq -c --arg sha "$EXPECTED_SHA" --arg branch "$branch" '
                [.workflow_runs[] | select(
                  (.head_sha | ascii_downcase) == $sha
                  and .event == "push"
                  and .head_branch == $branch
                )]
                | sort_by(.id, .run_attempt) | last // empty'
          }

          require_same_successful_attempt() {
            local workflow="$1"
            local branch="$2"
            local display_name="$3"
            local accepted="$4"
            local run_record
            run_record="$(latest_run "$workflow" "$branch")"
            test -n "$run_record" || {
              echo "::error::Newest exact-SHA ${display_name} run disappeared before release mutation"
              exit 1
            }
            local actual_id actual_attempt status conclusion
            actual_id="$(jq -r '.id' <<<"$run_record")"
            actual_attempt="$(jq -r '.run_attempt' <<<"$run_record")"
            status="$(jq -r '.status' <<<"$run_record")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_record")"
            if [ "${actual_id}:${actual_attempt}" != "$accepted" ]; then
              echo "::error::Superseded exact-SHA ${display_name} attempt: accepted ${accepted}, newest is ${actual_id}:${actual_attempt}"
              exit 1
            fi
            test "$status" = "completed" || {
              echo "::error::Newest exact-SHA ${display_name} attempt is ${status}"
              exit 1
            }
            test "$conclusion" = "success" || {
              echo "::error::Newest exact-SHA ${display_name} attempt concluded ${conclusion:-without a conclusion}"
              exit 1
            }
          }

          require_same_successful_attempt ci.yml "$SOURCE_BRANCH" "Cross-platform CI" "$CI_RUN"
          require_same_successful_attempt package-lifecycle.yml "$SOURCE_BRANCH" "Package lifecycle" "$PACKAGE_RUN"
          if [ "$REGISTRY_DIST_TAG" = "latest" ]; then
            require_same_successful_attempt deploy-docs.yml "$SOURCE_BRANCH" "Pages deployment" "$PAGES_RUN"
          fi

      # The bootstrap credential exists only in this no-source mutation step.
      # Normal mode leaves NODE_AUTH_TOKEN empty so npm Trusted Publishing uses OIDC.
      - name: Publish exact inspected tarball
        if: ${{ needs.inspect.outputs.publish_required == 'true' }}
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP" = "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::bootstrap requires the scoped NPM_BOOTSTRAP_TOKEN Actions secret"
            exit 1
          fi
          npm publish "$TARBALL" --tag "$REGISTRY_DIST_TAG" --access public --provenance --ignore-scripts

      - name: Create only missing immutable metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          RELEASE_REQUIRED: ${{ needs.inspect.outputs.release_required }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          TAG_REQUIRED: ${{ needs.inspect.outputs.tag_required }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_VERSION}"
          if [ "$TAG_REQUIRED" = "true" ]; then
            tag_probe="$(mktemp)"
            if gh api "repos/${REPOSITORY}/git/ref/tags/${release_tag}" >"$tag_probe" 2>&1; then
              echo "::error::Git tag ${release_tag} appeared after recovery preflight"
              exit 1
            fi
            case "$(<"$tag_probe")" in
              *"404"*|*"Not Found"*) ;;
              *)
                echo "::error::Unable to recheck Git tag ${release_tag}"
                cat "$tag_probe"
                exit 1
                ;;
            esac
            rm -f "$tag_probe"
            gh api --method POST "repos/${REPOSITORY}/git/refs"               -f "ref=refs/tags/${release_tag}"               -f "sha=${EXPECTED_SHA}" >/dev/null
          fi

          if [ "$RELEASE_REQUIRED" = "true" ]; then
            release_probe="$(mktemp)"
            if gh release view "$release_tag" >"$release_probe" 2>&1; then
              echo "::error::GitHub Release ${release_tag} appeared after recovery preflight"
              exit 1
            fi
            case "$(<"$release_probe")" in
              *"release not found"*) ;;
              *)
                echo "::error::Unable to recheck GitHub Release ${release_tag}"
                cat "$release_probe"
                exit 1
                ;;
            esac
            rm -f "$release_probe"
            notes_file="$(mktemp)"
            printf 'Published `frogprogsy@%s` from immutable commit `%s` with dist-tag `%s`.\n'               "$RELEASE_VERSION" "$EXPECTED_SHA" "$REGISTRY_DIST_TAG" > "$notes_file"
            release_flags=(--prerelease=false --latest)
            if [ "$REGISTRY_DIST_TAG" = "preview" ]; then
              release_flags=(--prerelease --latest=false)
            fi
            gh release create "$release_tag" --target "$EXPECTED_SHA" --title "$release_tag" --notes-file "$notes_file" "${release_flags[@]}"
            rm -f "$notes_file"
          fi

      - name: Registry smoke and verified provenance
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_TARBALL_INTEGRITY: ${{ needs.inspect.outputs.integrity }}
          LOCAL_TARBALL_SHA1: ${{ needs.inspect.outputs.sha1 }}
          LOCAL_TARBALL_SHA512_HEX: ${{ needs.inspect.outputs.sha512_hex }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          REGISTRY_CWD: ${{ runner.temp }}/release-registry-probe
        run: |
          set -euo pipefail
          pkg_name="$PACKAGE_NAME"
          mkdir -p "$REGISTRY_CWD"
          printf '%s\n' '{"name":"release-registry-probe","version":"0.0.0","private":true}' > "$REGISTRY_CWD/package.json"
          validate_existing_npm() {
            local proof_dir metadata_file tags_file registry_tarball attestation_file bundle_file verification_file workflow_commits_file
            local tarball_url attestation_url metadata_integrity metadata_shasum
            proof_dir="$(mktemp -d)"
            metadata_file="$proof_dir/metadata.json"
            tags_file="$proof_dir/tags.json"
            registry_tarball="$proof_dir/registry.tgz"
            attestation_file="$proof_dir/attestations.json"
            bundle_file="$proof_dir/attestations.jsonl"
            verification_file="$proof_dir/verified.json"
            workflow_commits_file="$proof_dir/workflow-commits.txt"

            bun pm view "${pkg_name}@${RELEASE_VERSION}" --json --cwd "$REGISTRY_CWD" > "$metadata_file"
            bun pm view "$pkg_name" dist-tags --json --cwd "$REGISTRY_CWD" > "$tags_file"
            tarball_url="$(jq -er '.dist.tarball | select(type == "string" and length > 0)' "$metadata_file")"
            attestation_url="$(jq -er '.dist.attestations.url | select(type == "string" and length > 0)' "$metadata_file")"
            curl --fail-with-body --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 1 --retry-all-errors \
              --output "$registry_tarball" "$tarball_url"
            cmp -s "$TARBALL" "$registry_tarball" || {
              echo "::error::registry tarball bytes differ from the inspected artifact"
              return 1
            }
            curl --fail-with-body --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 1 --retry-all-errors \
              --output "$attestation_file" "$attestation_url"
            jq -c '.. | objects | select(has("dsseEnvelope") and has("verificationMaterial"))' \
              "$attestation_file" > "$bundle_file"
            test -s "$bundle_file" || {
              echo "::error::npm attestation response contains no DSSE bundles"
              return 1
            }
            gh attestation verify "$TARBALL" \
              --bundle "$bundle_file" \
              --repo zhsks311/Frogprogsy \
              --signer-workflow zhsks311/Frogprogsy/.github/workflows/release.yml \
              --source-ref refs/heads/main \
              --digest-alg sha512 \
              --format json > "$verification_file"

            EXPECTED_CHANNEL="$REGISTRY_DIST_TAG" \
            EXPECTED_INTEGRITY="$LOCAL_TARBALL_INTEGRITY" \
            EXPECTED_SHA1="$LOCAL_TARBALL_SHA1" \
            EXPECTED_SHA512_HEX="$LOCAL_TARBALL_SHA512_HEX" \
            EXPECTED_VERSION="$RELEASE_VERSION" \
            METADATA_FILE="$metadata_file" \
            TAGS_FILE="$tags_file" \
            VERIFICATION_FILE="$verification_file" \
            WORKFLOW_COMMITS_FILE="$workflow_commits_file" \
              bun - <<'BUN'
          const metadata = await Bun.file(process.env.METADATA_FILE!).json();
          const tags = await Bun.file(process.env.TAGS_FILE!).json();
          if (
            metadata.version !== process.env.EXPECTED_VERSION
            || metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY
            || metadata.dist?.shasum !== process.env.EXPECTED_SHA1
            || tags[process.env.EXPECTED_CHANNEL!] !== process.env.EXPECTED_VERSION
          ) {
            throw new Error("existing npm version failed exact digest or channel validation");
          }
          const verified = await Bun.file(process.env.VERIFICATION_FILE!).json();
          const expectedDigest = process.env.EXPECTED_SHA512_HEX!;
          const expectedRepository = "zhsks311/Frogprogsy";
          const expectedRef = "refs/heads/main";
          const expectedSignerUri =
            "https://github.com/zhsks311/Frogprogsy/.github/workflows/release.yml@refs/heads/main";
          const workflowCommits: string[] = [];
          for (const row of Array.isArray(verified) ? verified : []) {
            const verificationResult = row?.verificationResult;
            const statement = verificationResult?.statement;
            if (
              statement?.predicateType !== "https://slsa.dev/provenance/v1"
              || statement.subject?.some((subject: { digest?: { sha512?: string } }) =>
                subject.digest?.sha512 === expectedDigest
              ) !== true
            ) continue;
            const certificate = verificationResult?.signature?.certificate;
            const workflowSha = certificate?.githubWorkflowSHA;
            if (
              certificate?.githubWorkflowRepository !== expectedRepository
              || certificate.githubWorkflowRef !== expectedRef
              || certificate.buildSignerURI !== expectedSignerUri
              || typeof workflowSha !== "string"
              || !/^[0-9a-f]{40}$/.test(workflowSha)
              || certificate.buildSignerDigest !== workflowSha
              || certificate.buildConfigDigest !== workflowSha
            ) continue;
            workflowCommits.push(workflowSha);
          }
          const uniqueWorkflowCommits = [...new Set(workflowCommits)].sort();
          if (uniqueWorkflowCommits.length === 0) {
            throw new Error("verified certificate lacks the trusted release workflow identity");
          }
          await Bun.write(process.env.WORKFLOW_COMMITS_FILE!, `${uniqueWorkflowCommits.join("\n")}\n`);
          BUN

            local provenance_on_main=false workflow_commit comparison
            while IFS= read -r workflow_commit; do
              [[ "$workflow_commit" =~ ^[0-9a-f]{40}$ ]] || return 1
              comparison="$(gh api "repos/${REPOSITORY}/compare/${workflow_commit}...main" --jq '.status')" || return 1
              case "$comparison" in
                ahead|identical) provenance_on_main=true ;;
              esac
            done < "$workflow_commits_file"
            test "$provenance_on_main" = "true" || {
              echo "::error::verified release workflow commit is not in current main history"
              return 1
            }
            rm -rf "$proof_dir"
          }

          for attempt in $(seq 1 30); do
            if validate_existing_npm; then
              echo "Registry bytes, exact digest, verified provenance, and ${REGISTRY_DIST_TAG} dist-tag are verified"
              exit 0
            fi
            echo "::notice::Registry provenance has not converged for ${pkg_name}@${RELEASE_VERSION} (${attempt}/30)"
            sleep 10
          done
          echo "::error::Registry smoke, provenance, or dist-tag verification failed"
          bun pm view "$pkg_name" versions dist-tags --cwd "$REGISTRY_CWD" || true
          exit 1

      - name: Report stable dist-tags and manual preview cleanup
        if: ${{ inputs.tag == 'latest' }}
        run: |
          set -euo pipefail
          dist_tags="$(npm view "$PACKAGE_NAME" dist-tags --json)"
          echo "Current npm dist-tags:"
          printf '%s\n' "$dist_tags"
          if DIST_TAGS="$dist_tags" node -e '
            const tags = JSON.parse(process.env.DIST_TAGS);
            process.exit(typeof tags.preview === "string" && tags.preview.length > 0 ? 0 : 1);
          '; then
            echo "Preview still exists. A maintainer may remove it manually with:"
            echo "npm dist-tag rm frogprogsy preview"
          fi
