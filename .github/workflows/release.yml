name: Release
run-name: "Release [${{ inputs.dispatch-id }}]"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared version to publish"
        required: true
        type: string
      expected-sha:
        description: "Full lowercase prepared merge commit SHA"
        required: true
        type: string
      source-branch:
        description: "Remote branch containing the prepared merge commit"
        required: true
        type: choice
        options:
          - develop
          - main
      tag:
        description: "Registry dist-tag derived from preparation evidence"
        required: true
        type: choice
        options:
          - latest
          - preview
      dry-run:
        description: "Validate and build without publishing"
        required: true
        type: boolean
        default: true
      bootstrap:
        description: "One-time first package publish with NPM_BOOTSTRAP_TOKEN"
        required: true
        type: boolean
        default: false
      recovery:
        description: "Recover an immutable previously prepared release"
        required: true
        type: boolean
        default: false
      dispatch-id:
        description: "Optional correlation ID for a manual dispatcher"
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.dispatch.outputs.artifact_name }}
      ci_run: ${{ steps.gates.outputs.ci_run }}
      package_run: ${{ steps.gates.outputs.package_run }}
      pages_run: ${{ steps.gates.outputs.pages_run }}
    steps:
      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Verify dispatch identity and exact SHA containment
        id: dispatch
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          DRY_RUN: ${{ inputs.dry-run }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          RECOVERY: ${{ inputs.recovery }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected-sha must be a full lowercase 40-character commit SHA"
            exit 1
          }
          [[ "$TRUSTED_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Trusted workflow definition SHA is not a full lowercase commit SHA"
            exit 1
          }
          test "$TRUSTED_WORKFLOW_REF" = "${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main" || {
            echo "::error::Release must use the trusted main workflow definition; got ${TRUSTED_WORKFLOW_REF}"
            exit 1
          }
          case "$SOURCE_BRANCH" in
            develop|main) ;;
            *) echo "::error::source-branch must be develop or main"; exit 1 ;;
          esac
          case "$BOOTSTRAP:$RECOVERY:$DRY_RUN" in
            true:true:*) echo "::error::bootstrap and recovery are mutually exclusive"; exit 1 ;;
            true:false:true) echo "::error::bootstrap is valid only for a real publish"; exit 1 ;;
            true:false:false|false:true:true|false:true:false|false:false:true|false:false:false) ;;
            *) echo "::error::bootstrap, recovery, and dry-run must be booleans"; exit 1 ;;
          esac
          case "$REGISTRY_DIST_TAG:$SOURCE_BRANCH" in
            preview:develop)
              [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-preview\.[1-9][0-9]*$ ]] || {
                echo "::error::preview requires X.Y.Z-preview.N with positive N"; exit 1;
              }
              ;;
            latest:main)
              [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
                echo "::error::latest requires X.Y.Z"; exit 1;
              }
              ;;
            preview:*) echo "::error::preview requires source-branch develop"; exit 1 ;;
            latest:*) echo "::error::latest requires source-branch main"; exit 1 ;;
            *) echo "::error::tag must be latest or preview"; exit 1 ;;
          esac
          if [ "$BOOTSTRAP" = "true" ] && { [ "$SOURCE_BRANCH" != "main" ] || [ "$REGISTRY_DIST_TAG" != "latest" ]; }; then
            echo "::error::bootstrap must use source-branch main and tag latest"
            exit 1
          fi
          source_status="$(gh api "repos/${REPOSITORY}/compare/${EXPECTED_SHA}...${SOURCE_BRANCH}" --jq '.status')"
          case "$source_status" in
            ahead|identical) ;;
            *) echo "::error::Expected SHA ${EXPECTED_SHA} is not contained in ${SOURCE_BRANCH}"; exit 1 ;;
          esac
          workflow_status="$(gh api "repos/${REPOSITORY}/compare/${TRUSTED_WORKFLOW_SHA}...main" --jq '.status')"
          case "$workflow_status" in
            ahead|identical) ;;
            *) echo "::error::Trusted workflow definition is not contained in main history"; exit 1 ;;
          esac
          package_file="$RUNNER_TEMP/preflight-package.json"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${REPOSITORY}/contents/package.json?ref=${EXPECTED_SHA}" > "$package_file"
          PACKAGE_FILE="$package_file" RELEASE_VERSION="$RELEASE_VERSION" bun - <<'BUN'
          const pkg = await Bun.file(process.env.PACKAGE_FILE!).json();
          if (pkg.name !== "frogprogsy" || pkg.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `package identity ${pkg.name}@${pkg.version} != frogprogsy@${process.env.RELEASE_VERSION}`,
            );
          }
          if (pkg.repository?.url !== "git+https://github.com/zhsks311/Frogprogsy.git") {
            throw new Error("package.json repository.url must identify zhsks311/Frogprogsy exactly");
          }
          BUN
          echo "artifact_name=release-${EXPECTED_SHA}-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Reclassify immutable preparation evidence
        if: ${{ inputs.bootstrap != true }}
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          merge_json="$(gh api "repos/${REPOSITORY}/commits/${EXPECTED_SHA}")"
          mapfile -t merge_parents < <(jq -r '.parents[].sha | ascii_downcase' <<<"$merge_json")
          test "${#merge_parents[@]}" -eq 2 || {
            echo "::error::Prepared release SHA must be an exact two-parent merge commit"
            exit 1
          }
          associated_prs="$(gh api -H "Accept: application/vnd.github+json" "repos/${REPOSITORY}/commits/${EXPECTED_SHA}/pulls")"
          matching_prs="$(jq -c --arg sha "$EXPECTED_SHA" --arg branch "$SOURCE_BRANCH" '[.[] | select(((.merge_commit_sha // "") | ascii_downcase) == $sha and .merged_at != null and .base.ref == $branch)]' <<<"$associated_prs")"
          matching_count="$(jq 'length' <<<"$matching_prs")"
          test "$matching_count" -eq 1 || {
            echo "::error::Expected exactly one merged pull request for ${EXPECTED_SHA} into ${SOURCE_BRANCH}; found ${matching_count}"
            exit 1
          }
          pull_request="$(jq -r '.[0].number' <<<"$matching_prs")"
          compare_file="$RUNNER_TEMP/source-side-compare.json"
          gh api --paginate "repos/${REPOSITORY}/compare/${merge_parents[0]}...${merge_parents[1]}?per_page=100" --slurp > "$compare_file"
          mapfile -t source_shas < <(jq -r '[.[].commits[].sha | ascii_downcase] | (reduce .[] as $sha ([]; if index($sha) == null then . + [$sha] else . end))[]' "$compare_file")
          test "${#source_shas[@]}" -gt 0 || {
            echo "::error::Prepared merge has no source-side commits"
            exit 1
          }
          source_commits='[]'
          for commit_sha in "${source_shas[@]}"; do
            commit_pages="$RUNNER_TEMP/commit-${commit_sha}.json"
            gh api --paginate "repos/${REPOSITORY}/commits/${commit_sha}?per_page=100" --slurp > "$commit_pages"
            record="$(jq -c '.[0] as $commit | {sha:($commit.sha | ascii_downcase),message:$commit.commit.message,parents:[$commit.parents[].sha | ascii_downcase],verified:($commit.commit.verification.verified == true),authorLogin:($commit.author.login // ""),committerLogin:($commit.committer.login // ""),changedPaths:([.[].files[].filename] | sort)}' "$commit_pages")"
            source_commits="$(jq -cn --argjson values "$source_commits" --argjson record "$record" '$values + [$record]')"
          done
          candidate="$RUNNER_TEMP/release-evidence.json"
          jq -S -n \
            --argjson pullRequest "$pull_request" \
            --arg mergeSha "$EXPECTED_SHA" \
            --arg mergeMessage "$(jq -r '.commit.message' <<<"$merge_json")" \
            --arg baseParent "${merge_parents[0]}" \
            --arg sourceParent "${merge_parents[1]}" \
            --arg releaseVersion "$RELEASE_VERSION" \
            --arg registryTag "$REGISTRY_DIST_TAG" \
            --arg sourceBranch "$SOURCE_BRANCH" \
            --argjson sourceCommits "$source_commits" \
            '{pullRequest:$pullRequest,mergeCommit:{sha:$mergeSha,message:$mergeMessage,parents:[$baseParent,$sourceParent]},sourceSideCommitsOldestFirst:$sourceCommits,releaseVersion:$releaseVersion,registryTag:$registryTag,sourceBranch:$sourceBranch}' > "$candidate"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/${REPOSITORY}/contents/scripts/release-policy.ts?ref=${TRUSTED_WORKFLOW_SHA}" \
            > "$RUNNER_TEMP/trusted-release-policy.ts"
          cat > "$RUNNER_TEMP/reclassify-release.ts" <<'BUN'
          const { classifyMergedRelease, parseReleaseRecord } = await import(
            `${process.env.RUNNER_TEMP}/trusted-release-policy.ts`
          );
          const snapshot = await Bun.file(process.env.CANDIDATE_PATH!).json();
          const ownedCommits = snapshot.sourceSideCommitsOldestFirst.filter((commit: {
            verified: boolean; authorLogin: string; committerLogin: string; parents: string[]; changedPaths: string[];
          }) => commit.verified
            && commit.authorLogin === "github-actions[bot]"
            && commit.committerLogin === "web-flow"
            && commit.parents.length === 1
            && commit.changedPaths.length === 1
            && commit.changedPaths[0] === "package.json"
            && parseReleaseRecord(commit) !== null);
          const classification = classifyMergedRelease({
            pullRequest: snapshot.pullRequest,
            mergeCommit: snapshot.mergeCommit,
            sourceSideCommitsOldestFirst: ownedCommits,
          });
          if (classification.kind === "no-release") throw new Error("merge has no current verified immutable preparation");
          const expectedKind = snapshot.registryTag === "preview" ? "preview" : "latest";
          const expectedBranch = expectedKind === "preview" ? "develop" : "main";
          if (classification.kind !== expectedKind) throw new Error(`preparation channel ${classification.kind} does not match ${expectedKind}`);
          if (snapshot.sourceBranch !== expectedBranch) throw new Error(`${expectedKind} preparation cannot publish from ${snapshot.sourceBranch}`);
          if (classification.preparation.targetVersion !== snapshot.releaseVersion) {
            throw new Error(`prepared version ${classification.preparation.targetVersion} does not match ${snapshot.releaseVersion}`);
          }
          BUN
          CANDIDATE_PATH="$candidate" bun "$RUNNER_TEMP/reclassify-release.ts"

      - name: Bind newest exact-SHA gate attempts
        id: gates
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ inputs.source-branch }}
        run: |
          set -euo pipefail

          latest_run() {
            local workflow="$1"
            local branch="$2"
            gh api "repos/${REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${EXPECTED_SHA}&event=push&branch=${branch}&per_page=100" |
              jq -c --arg sha "$EXPECTED_SHA" --arg branch "$branch" '
                [.workflow_runs[] | select(
                  (.head_sha | ascii_downcase) == $sha
                  and .event == "push"
                  and .head_branch == $branch
                )]
                | sort_by(.id, .run_attempt) | last // empty'
          }

          require_latest_success() {
            local workflow="$1"
            local branch="$2"
            local display_name="$3"
            local run_record
            run_record="$(latest_run "$workflow" "$branch")"
            test -n "$run_record" || {
              echo "::error::No ${display_name} push run exists for ${EXPECTED_SHA} on ${branch}"
              exit 1
            }
            local run_id run_attempt status conclusion
            run_id="$(jq -r '.id' <<<"$run_record")"
            run_attempt="$(jq -r '.run_attempt' <<<"$run_record")"
            status="$(jq -r '.status' <<<"$run_record")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_record")"
            test "$status" = "completed" || {
              echo "::error::Newest ${display_name} run ${run_id}:${run_attempt} is ${status}; refusing release"
              exit 1
            }
            test "$conclusion" = "success" || {
              echo "::error::Newest ${display_name} run ${run_id}:${run_attempt} concluded ${conclusion:-without a conclusion}"
              exit 1
            }
            printf '%s:%s\n' "$run_id" "$run_attempt"
          }

          PAGES_GATE_WAIT_TIMEOUT_SECONDS=2700
          wait_for_latest_success() {
            local workflow="$1"
            local branch="$2"
            local display_name="$3"
            local deadline=$((SECONDS + PAGES_GATE_WAIT_TIMEOUT_SECONDS))
            while true; do
              local run_record run_id run_attempt status conclusion
              run_record="$(latest_run "$workflow" "$branch")"
              if [ -n "$run_record" ]; then
                run_id="$(jq -r '.id' <<<"$run_record")"
                run_attempt="$(jq -r '.run_attempt' <<<"$run_record")"
                status="$(jq -r '.status' <<<"$run_record")"
                conclusion="$(jq -r '.conclusion // ""' <<<"$run_record")"
                if [ "$status" = "completed" ]; then
                  if [ "$conclusion" != "success" ]; then
                    echo "::error::Newest ${display_name} run ${run_id}:${run_attempt} concluded ${conclusion:-without a conclusion}" >&2
                    exit 1
                  fi
                  printf '%s:%s\n' "$run_id" "$run_attempt"
                  return
                fi
                case "$status" in
                  queued|in_progress|pending|requested|waiting) ;;
                  *)
                    echo "::error::Newest ${display_name} run ${run_id}:${run_attempt} has invalid status ${status}" >&2
                    exit 1
                    ;;
                esac
              fi
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for newest successful ${display_name} push run at ${EXPECTED_SHA}" >&2
                exit 1
              fi
              echo "::notice::Waiting for newest ${display_name} push attempt at ${EXPECTED_SHA}" >&2
              sleep 15
            done
          }

          ci_run="$(require_latest_success ci.yml "$SOURCE_BRANCH" "Cross-platform CI")"
          package_run="$(require_latest_success package-lifecycle.yml "$SOURCE_BRANCH" "Package lifecycle")"
          echo "ci_run=${ci_run}" >> "$GITHUB_OUTPUT"
          echo "package_run=${package_run}" >> "$GITHUB_OUTPUT"
          if [ "$REGISTRY_DIST_TAG" = "latest" ]; then
            pages_run="$(wait_for_latest_success deploy-docs.yml "$SOURCE_BRANCH" "Pages deployment")"
            echo "pages_run=${pages_run}" >> "$GITHUB_OUTPUT"
          else
            echo "pages_run=" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact prepared SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build exactly one release tarball
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected-sha }}"
          bun run prepublishOnly
          bun scripts/dev-package.ts build --skip-gates
          TARBALL="$(bun scripts/dev-package.ts path)"
          test -f "$TARBALL" || {
            echo "::error::Package builder did not return a tarball"
            exit 1
          }
          resolved_tarball="$(realpath "$TARBALL")"
          case "$resolved_tarball" in
            "$GITHUB_WORKSPACE"/*) ;;
            *) echo "::error::Package builder returned a path outside the selected workspace"; exit 1 ;;
          esac
          tarball_dir="$(dirname "$resolved_tarball")"
          shopt -s nullglob
          tarballs=("$tarball_dir"/*.tgz)
          test "${#tarballs[@]}" -eq 1 && test "${tarballs[0]}" = "$resolved_tarball" || {
            echo "::error::Package builder must produce exactly one tarball"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/release-upload"
          cp "$resolved_tarball" "$RUNNER_TEMP/release-upload/"

      - name: Upload untrusted build artifact under preflight-fixed name
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-upload/*.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  inspect:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKAGE_NAME: frogprogsy
    permissions:
      actions: read
      contents: read
    outputs:
      tarball_name: ${{ steps.artifact.outputs.tarball_name }}
      sha1: ${{ steps.artifact.outputs.sha1 }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      sha512_hex: ${{ steps.artifact.outputs.sha512_hex }}
      integrity: ${{ steps.artifact.outputs.integrity }}
      publish_required: ${{ steps.state.outputs.publish_required }}
      tag_required: ${{ steps.state.outputs.tag_required }}
      release_required: ${{ steps.state.outputs.release_required }}
    steps:
      - name: Setup trusted Bun runtime
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Download preflight-named artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.preflight.outputs.artifact_name }}
          path: release-artifact

      - name: Inspect exact artifact bytes and package identity
        id: artifact
        env:
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          REGISTRY_DIST_TAG: ${{ inputs.tag }}
          PAGES_CATALOG_URL: https://zhsks311.github.io/Frogprogsy/catalog/v1/model-catalog.json
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(release-artifact/*.tgz)
          test "${#tarballs[@]}" -eq 1 || {
            echo "::error::Build artifact must contain exactly one tarball"
            exit 1
          }
          TARBALL="${tarballs[0]}"
          inspect_dir="$(mktemp -d)"
          trap 'rm -rf "$inspect_dir"' EXIT
          tar -xzf "$TARBALL" -C "$inspect_dir" \
            package/package.json package/src/generated/model-catalog-v1.json
          PACKAGE_JSON="$inspect_dir/package/package.json" \
          PACKAGE_CATALOG="$inspect_dir/package/src/generated/model-catalog-v1.json" \
          TARBALL_PATH="$TARBALL" \
            bun - <<'BUN'
          import { createHash } from "node:crypto";
          import { appendFileSync } from "node:fs";
          import { basename } from "node:path";
          const canonicalize = (value: unknown): unknown => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value === null || typeof value !== "object") return value;
            const source = value as Record<string, unknown>;
            const sorted: Record<string, unknown> = {};
            for (const key of Object.keys(source).sort()) {
              if (source[key] !== undefined) sorted[key] = canonicalize(source[key]);
            }
            return sorted;
          };
          const bytes = Buffer.from(await Bun.file(process.env.TARBALL_PATH!).arrayBuffer());
          const pkg = await Bun.file(process.env.PACKAGE_JSON!).json();
          const catalog = await Bun.file(process.env.PACKAGE_CATALOG!).json();
          if (
            pkg.name !== "frogprogsy"
            || pkg.version !== process.env.EXPECTED_VERSION
            || pkg.repository?.url !== "git+https://github.com/zhsks311/Frogprogsy.git"
          ) throw new Error("artifact package identity differs from the requested release");
          if (
            catalog === null
            || typeof catalog !== "object"
            || catalog.schemaVersion !== 1
            || !Number.isInteger(catalog.catalogRevision)
            || catalog.catalogRevision <= 0
            || !Array.isArray(catalog.providers)
            || catalog.sourceCommit !== process.env.EXPECTED_SHA
          ) throw new Error("artifact catalog identity or source commit differs");
          const catalogDigest = createHash("sha256")
            .update(JSON.stringify(canonicalize(catalog.providers)))
            .digest("hex");
          if (catalog.catalogDigest !== catalogDigest) throw new Error("artifact catalog digest is invalid");
          const sha1 = createHash("sha1").update(bytes).digest("hex");
          const sha256 = createHash("sha256").update(bytes).digest("hex");
          const sha512Hex = createHash("sha512").update(bytes).digest("hex");
          const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
          appendFileSync(process.env.GITHUB_OUTPUT!, [
            `tarball_name=${basename(process.env.TARBALL_PATH!)}`,
            `sha1=${sha1}`,
            `sha256=${sha256}`,
            `sha512_hex=${sha512Hex}`,
            `integrity=${integrity}`,
            "",
          ].join("\n"));
          BUN
          if [ "$REGISTRY_DIST_TAG" = "latest" ]; then
            pages_catalog="$inspect_dir/pages-model-catalog-v1.json"
            curl --fail-with-body --silent --show-error --location \
              --proto '=https' --proto-redir '=https' \
              --retry 3 --retry-delay 1 --retry-all-errors \
              --header "Cache-Control: no-cache" \
              --header "Pragma: no-cache" \
              --output "$pages_catalog" \
              "${PAGES_CATALOG_URL}?release-sha=${EXPECTED_SHA}"
            PACKAGE_CATALOG="$inspect_dir/package/src/generated/model-catalog-v1.json" \
            PAGES_CATALOG="$pages_catalog" EXPECTED_SHA="$EXPECTED_SHA" bun - <<'BUN'
          import { createHash } from "node:crypto";
          const canonicalize = (value: unknown): unknown => {
            if (Array.isArray(value)) return value.map(canonicalize);
            if (value === null || typeof value !== "object") return value;
            const source = value as Record<string, unknown>;
            const sorted: Record<string, unknown> = {};
            for (const key of Object.keys(source).sort()) {
              if (source[key] !== undefined) sorted[key] = canonicalize(source[key]);
            }
            return sorted;
          };
          const packageCatalog = await Bun.file(process.env.PACKAGE_CATALOG!).json();
          const pagesCatalog = await Bun.file(process.env.PAGES_CATALOG!).json();
          const digest = (catalog: any) => createHash("sha256")
            .update(JSON.stringify(canonicalize(catalog.providers)))
            .digest("hex");
          if (
            pagesCatalog.sourceCommit !== process.env.EXPECTED_SHA
            || pagesCatalog.catalogDigest !== digest(pagesCatalog)
            || packageCatalog.catalogRevision !== pagesCatalog.catalogRevision
            || packageCatalog.catalogDigest !== pagesCatalog.catalogDigest
          ) throw new Error("deployed Pages catalog differs from the inspected artifact");
          BUN
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          rm -rf "$inspect_dir"
          trap - EXIT

      - name: Resolve normal or recovery state
        id: state
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          DRY_RUN: ${{ inputs.dry-run }}
          EXPECTED_SHA: ${{ inputs.expected-sha }}
          GH_TOKEN: ${{ github.token }}
          LOCAL_TARBALL_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          LOCAL_TARBALL_SHA1: ${{ steps.artifact.outputs.sha1 }}
          LOCAL_TARBALL_SHA512_HEX: ${{ steps.artifact.outputs.sha512_hex }}
          RECOVERY: ${{ inputs.recovery }}
